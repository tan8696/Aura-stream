<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AuraStream</title>
  <meta name="description" content="AuraStream — a music player with open-source tracks, explainable recommendations, synced lyrics and a studio EQ." />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='11' fill='%231ed760'/><rect x='6.5' y='9' width='2' height='6' rx='1'/><rect x='11' y='6' width='2' height='12' rx='1'/><rect x='15.5' y='8' width='2' height='8' rx='1'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
</head>
<body>

<div class="app" id="app">

  <!-- Top bar -->
  <header class="topbar">
    <button class="brand" data-nav="home" aria-label="AuraStream home">
      <i data-icon="logo" data-size="30" class="brand-mark"></i>
      <span class="brand-name">AuraStream</span>
    </button>

    <div class="topbar-history">
      <button class="icon-btn round" id="btn-nav-back" aria-label="Go back" disabled><i data-icon="chevron-left"></i></button>
      <button class="icon-btn round" id="btn-nav-forward" aria-label="Go forward" disabled><i data-icon="chevron-right"></i></button>
    </div>

    <div class="topbar-center">
      <button class="home-btn" data-nav="home" aria-label="Home" title="Home"><i data-icon="home" data-size="22"></i></button>
      <label class="search-box">
        <i data-icon="search" data-size="20"></i>
        <input id="omnibox-search" type="search" placeholder="What do you want to play?" autocomplete="off" spellcheck="false" aria-label="Search songs, artists and moods" />
        <kbd class="search-kbd">/</kbd>
      </label>
    </div>

    <div class="topbar-right">
      <div class="dial" title="Discovery Dial: how adventurous your recommendations are">
        <i data-icon="compass" data-size="18"></i>
        <input class="range dial-range" id="discovery-dial-slider" type="range" min="0" max="100" aria-label="Discovery Dial" />
        <span class="dial-value" id="dial-mode-label">Blend</span>
      </div>
    </div>
  </header>

  <!-- Library sidebar -->
  <aside class="sidebar panel" id="sidebar" aria-label="Your Library">
    <div class="library-header">
      <button class="library-title" data-nav="library" title="Your Library"><i data-icon="library" data-size="22"></i><span class="library-title-text">Your Library</span></button>
      <button class="icon-btn round" data-action="create-playlist" aria-label="Create playlist" title="Create playlist"><i data-icon="plus"></i></button>
    </div>
    <div class="chip-row" id="lib-filter-row" role="tablist">
      <button class="chip active" data-filter="all" role="tab">All</button>
      <button class="chip" data-filter="playlists" role="tab">Playlists</button>
      <button class="chip" data-filter="artists" role="tab">Artists</button>
    </div>
    <div class="library-list" id="sidebar-library-list"></div>
  </aside>

  <!-- Main view -->
  <main class="main panel" id="main-content">
    <div id="stage-content"></div>
  </main>

  <!-- Right panel: now playing / queue / lyrics / EQ -->
  <aside class="right-panel panel hidden" id="right-panel" aria-label="Now playing details">
    <div class="panel-tabs" role="tablist">
      <button class="panel-tab" data-panel="nowplaying" role="tab">Now playing</button>
      <button class="panel-tab" data-panel="queue" role="tab">Queue</button>
      <button class="panel-tab" data-panel="lyrics" role="tab">Lyrics</button>
      <button class="panel-tab" data-panel="eq" role="tab">EQ</button>
      <button class="icon-btn round panel-close" id="btn-right-panel-close" aria-label="Close panel"><i data-icon="x" data-size="18"></i></button>
    </div>
    <div class="panel-body" id="right-drawer"></div>
  </aside>

  <!-- Player bar -->
  <footer class="player-bar" id="player-bar">
    <div class="player-track">
      <button class="player-art-btn" id="player-thumb-wrap" aria-label="Show now playing">
        <img class="player-art" id="player-thumb" alt="" />
      </button>
      <div class="player-track-text">
        <div class="player-title" id="player-track-title"></div>
        <button class="player-artist link" id="player-track-artist"></button>
      </div>
      <button class="icon-btn like-btn" id="player-like-btn" aria-label="Save to Liked Songs"><i data-icon="heart" data-size="18"></i></button>
    </div>

    <div class="player-center">
      <div class="player-controls">
        <button class="icon-btn ctrl" id="btn-shuffle" aria-label="Shuffle: off" title="Shuffle: off"><i data-icon="shuffle" data-size="18"></i></button>
        <button class="icon-btn ctrl" id="btn-prev" aria-label="Previous" title="Previous"><i data-icon="prev" data-size="18"></i></button>
        <button class="play-btn" id="btn-play-pause" aria-label="Play"><i data-icon="play" data-size="18"></i></button>
        <button class="icon-btn ctrl" id="btn-next" aria-label="Next" title="Next"><i data-icon="next" data-size="18"></i></button>
        <button class="icon-btn ctrl" id="btn-repeat" aria-label="Repeat: off" title="Repeat: off"><i data-icon="repeat" data-size="18"></i></button>
      </div>
      <div class="player-progress">
        <span class="time" id="scrub-current">0:00</span>
        <input class="range progress-range" id="scrub-range" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek" />
        <span class="time" id="scrub-total">0:00</span>
      </div>
    </div>

    <div class="player-extra">
      <canvas class="mini-visualizer" id="mini-visualizer" width="56" height="24" title="Visualizer: click to change style"></canvas>
      <button class="icon-btn ctrl" id="btn-panel-nowplaying" data-panel="nowplaying" aria-label="Now playing view" title="Now playing view"><i data-icon="nowplaying" data-size="18"></i></button>
      <button class="icon-btn ctrl" id="btn-panel-lyrics" data-panel="lyrics" aria-label="Lyrics" title="Lyrics"><i data-icon="lyrics" data-size="18"></i></button>
      <button class="icon-btn ctrl" id="btn-panel-queue" data-panel="queue" aria-label="Queue" title="Queue"><i data-icon="queue" data-size="18"></i></button>
      <button class="icon-btn ctrl" id="btn-panel-eq" data-panel="eq" aria-label="Equalizer" title="Equalizer"><i data-icon="eq" data-size="18"></i></button>
      <div class="volume">
        <button class="icon-btn ctrl" id="btn-mute" aria-label="Mute" title="Mute"></button>
        <input class="range volume-range" id="volume-slider" type="range" min="0" max="100" aria-label="Volume" />
      </div>
      <button class="icon-btn ctrl" id="btn-theater" aria-label="Full screen" title="Full screen"><i data-icon="maximize" data-size="18"></i></button>
    </div>
  </footer>

  <!-- Mobile tab bar -->
  <nav class="mobile-nav" aria-label="Primary">
    <button class="mobile-nav-btn" data-nav="home"><i data-icon="home" data-size="22"></i><span>Home</span></button>
    <button class="mobile-nav-btn" data-nav="search"><i data-icon="search" data-size="22"></i><span>Search</span></button>
    <button class="mobile-nav-btn" data-nav="library"><i data-icon="library" data-size="22"></i><span>Your Library</span></button>
  </nav>
</div>

<!-- Full-screen player -->
<div class="theater" id="fullscreen-theater" aria-hidden="true"></div>

<!-- Create playlist dialog -->
<div class="modal-overlay" id="create-playlist-modal">
  <form class="modal" id="create-playlist-form" role="dialog" aria-modal="true" aria-labelledby="create-playlist-title">
    <div class="modal-header">
      <h2 class="modal-title" id="create-playlist-title">Create playlist</h2>
      <button type="button" class="icon-btn round" data-close-modal aria-label="Close"><i data-icon="x" data-size="18"></i></button>
    </div>
    <label class="field">
      <span class="field-label">Name</span>
      <input class="input" id="playlist-name-input" type="text" placeholder="My Playlist #1" maxlength="60" required />
    </label>
    <label class="field">
      <span class="field-label">Description <span class="muted">(optional)</span></span>
      <input class="input" id="playlist-desc-input" type="text" placeholder="Add an optional description" maxlength="120" />
    </label>
    <div class="modal-footer">
      <button type="button" class="btn btn-ghost" data-close-modal>Cancel</button>
      <button type="submit" class="btn btn-primary">Create</button>
    </div>
  </form>
</div>

<!-- Recommendation explainer dialog -->
<div class="modal-overlay" id="explain-rec-modal">
  <div class="modal modal-wide" role="dialog" aria-modal="true" aria-labelledby="explain-title">
    <div class="modal-header">
      <div>
        <h2 class="modal-title" id="explain-title">Why this recommendation?</h2>
        <p class="modal-sub">Computed in your browser from open audio features. No tracking.</p>
      </div>
      <button type="button" class="icon-btn round" data-close-modal aria-label="Close"><i data-icon="x" data-size="18"></i></button>
    </div>
    <div id="explain-body"></div>
    <div class="modal-footer">
      <button type="button" class="btn btn-ghost" data-close-modal>Close</button>
      <button type="button" class="btn btn-primary" id="explain-play-btn">Play song</button>
    </div>
  </div>
</div>

<div class="menu" id="context-menu" role="menu" hidden></div>
<div class="toast-stack" id="toast-stack" role="status" aria-live="polite"></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
