<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bg_chill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <radialGradient id="sun_chill" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="500" height="500" fill="url(#bg_chill)"/>
  
  <!-- Warm setting sun -->
  <circle cx="250" cy="210" r="130" fill="url(#sun_chill)"/>
  <circle cx="250" cy="210" r="70" fill="#FDE68A" opacity="0.85"/>
  
  <!-- Subtle vinyl grooves -->
  <circle cx="250" cy="210" r="160" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <circle cx="250" cy="210" r="115" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  
  <!-- Bottom Glass Badge -->
  <rect x="30" y="380" width="440" height="90" rx="16" fill="rgba(15,10,8,0.82)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="50" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">Sunset Lo-Fi Study</text>
  <text x="50" y="448" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#F59E0B" letter-spacing="1">CURATED PLAYLIST • 5 TRACKS</text>
</svg>