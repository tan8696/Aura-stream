<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bg_acoustic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <radialGradient id="ring_acoustic" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="500" height="500" fill="url(#bg_acoustic)"/>
  
  <!-- Soundhole circles -->
  <circle cx="250" cy="210" r="140" fill="url(#ring_acoustic)"/>
  <circle cx="250" cy="210" r="100" fill="rgba(6,78,59,0.8)" stroke="#34D399" stroke-width="2"/>
  <circle cx="250" cy="210" r="60" fill="#042F2E"/>
  
  <!-- Guitar Strings -->
  <line x1="220" y1="50" x2="220" y2="350" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <line x1="235" y1="50" x2="235" y2="350" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <line x1="250" y1="50" x2="250" y2="350" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <line x1="265" y1="50" x2="265" y2="350" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <line x1="280" y1="50" x2="280" y2="350" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  
  <!-- Bottom Glass Badge -->
  <rect x="30" y="380" width="440" height="90" rx="16" fill="rgba(4,47,46,0.85)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="50" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">Woodland Acoustic</text>
  <text x="50" y="448" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#34D399" letter-spacing="1">CURATED PLAYLIST • 3 TRACKS</text>
</svg>