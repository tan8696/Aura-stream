<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bg_synth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>
    <radialGradient id="glow_synth" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur_synth">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bg_synth)"/>
  
  <!-- Cyber glow rings -->
  <circle cx="250" cy="220" r="160" fill="url(#glow_synth)"/>
  <circle cx="250" cy="220" r="130" fill="none" stroke="rgba(0,242,254,0.3)" stroke-width="2"/>
  <circle cx="250" cy="220" r="90" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <circle cx="250" cy="220" r="50" fill="rgba(10,12,20,0.7)" stroke="#00F2FE" stroke-width="2"/>
  
  <!-- Center Icon: Pulse/Wave -->
  <path d="M225 220 L235 220 L242 205 L250 235 L258 212 L265 225 L275 220" fill="none" stroke="#00F2FE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Bottom Glass Badge -->
  <rect x="30" y="380" width="440" height="90" rx="16" fill="rgba(8,10,16,0.8)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="50" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">Cyber Synth Euphoria</text>
  <text x="50" y="448" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#00F2FE" letter-spacing="1">CURATED PLAYLIST • 6 TRACKS</text>
</svg>