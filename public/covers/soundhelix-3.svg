    <!-- Glass Title Card -->
    <rect x="25" y="380" width="450" height="95" rx="16" fill="rgba(7, 10, 15, 0.75)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="50" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">Deep Chill Pulse</text>
    <text x="50" y="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#94A3B8">SoundHelix</text>
