<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
    <defs>
      <linearGradient id="bgGrad_soundhelix-3" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#475569"/>
        <stop offset="50%" stop-color="#334155"/>
        <stop offset="100%" stop-color="#0F172A"/>
      </linearGradient>
      <radialGradient id="glowGrad_soundhelix-3" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#475569" stop-opacity="0"/>
      </radialGradient>
      <filter id="blur_soundhelix-3">
        <feGaussianBlur stdDeviation="30"/>
      </filter>
    </defs>
    <rect width="500" height="500" fill="url(#bgGrad_soundhelix-3)"/>
    <circle cx="250" cy="200" r="160" fill="url(#glowGrad_soundhelix-3)"/>
    <circle cx="120" cy="380" r="100" fill="#94A3B8" opacity="0.2" filter="url(#blur_soundhelix-3)"/>
    <circle cx="380" cy="120" r="120" fill="#475569" opacity="0.35" filter="url(#blur_soundhelix-3)"/>
    
    <!-- Abstract vinyl grooves -->
    <circle cx="250" cy="230" r="190" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
    <circle cx="250" cy="230" r="150" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="1.5"/>
    <circle cx="250" cy="230" r="110" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <circle cx="250" cy="230" r="70" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    
    <!-- Center Core Badge -->
    <circle cx="250" cy="230" r="35" fill="rgba(10,12,18,0.85)" stroke="#94A3B8" stroke-width="2.5"/>
