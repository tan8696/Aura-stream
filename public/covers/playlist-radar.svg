<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bg_radar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <radialGradient id="sweep_radar" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="500" height="500" fill="url(#bg_radar)"/>
  
  <!-- Radar sweep circles & crosshairs -->
  <circle cx="250" cy="210" r="150" fill="url(#sweep_radar)"/>
  <circle cx="250" cy="210" r="140" fill="none" stroke="rgba(56,189,248,0.25)" stroke-width="1.5"/>
  <circle cx="250" cy="210" r="100" fill="none" stroke="rgba(56,189,248,0.35)" stroke-width="1.5"/>
  <circle cx="250" cy="210" r="60" fill="none" stroke="rgba(56,189,248,0.5)" stroke-width="1.5"/>
  <line x1="250" y1="60" x2="250" y2="360" stroke="rgba(56,189,248,0.2)" stroke-width="1.5"/>
  <line x1="100" y1="210" x2="400" y2="210" stroke="rgba(56,189,248,0.2)" stroke-width="1.5"/>
  <circle cx="290" cy="180" r="6" fill="#38BDF8"/>
  <circle cx="210" cy="240" r="5" fill="#38BDF8" opacity="0.7"/>
  <circle cx="250" cy="210" r="8" fill="#FFF"/>
  
  <!-- Bottom Glass Badge -->
  <rect x="30" y="380" width="440" height="90" rx="16" fill="rgba(10,20,45,0.85)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="50" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">Discovery Radar</text>
  <text x="50" y="448" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38BDF8" letter-spacing="1">CURATED PLAYLIST • 6 TRACKS</text>
</svg>